[project]
name = "agentrecall"
version = "0.2.0"
description = "Keep AI coding-agent skills, instructions, permissions, and project history in sync from ~/.agents."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Arpit Garg" },
]
keywords = ["agents", "skills", "claude-code", "cursor", "codex", "opencode"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/bluearpit/agentrecall"

[project.scripts]
agentrecall = "agentrecall.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentrecall"]

[tool.hatch.build.targets.wheel.force-include]
"src/agentrecall/data/skills/search-project-history/SKILL.md" = "agentrecall/data/skills/search-project-history/SKILL.md"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
